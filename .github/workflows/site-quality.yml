name: Site quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/analytics.js
          node --check assets/reading-mode.js
          node --check sw.js
      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Audit pages, accessibility basics and internal links
        run: node scripts/quality-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-audit
          path: reports/static-audit.json
          if-no-files-found: ignore
