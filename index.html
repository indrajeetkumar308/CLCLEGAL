<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Choudhary Law Chambers, Advocates, Boring Road, Patna. Patna High Court and courts of Bihar.">
<meta property="og:title" content="Choudhary Law Chambers — Advocates, Patna">
<meta property="og:description" content="Criminal, civil, property, family, succession and recovery matters before the Patna High Court and courts of Bihar.">
<meta property="og:type" content="website">
<style>img{max-width:100%}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E2240">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLC">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
<title>Choudhary Law Chambers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --alt:#F4F6F9; --surface:#FFFFFF; --ink:#1A2332; --muted:#5A6476; --faint:#8791A2; --line:#E2E6ED;
  --navy:#0E2240; --navy-2:#0A1930; --navy-ink:#EEF2F8; --navy-muted:#A9B5C8; --navy-line:rgba(255,255,255,.12);
  --gold:#A9834C; --gold-2:#C9A96E; --gold-soft:#F6F0E4; --title:#0E2240;
  --shadow:0 1px 2px rgba(14,34,64,.06),0 12px 32px -18px rgba(14,34,64,.28);
  --serif:"Cormorant Garamond", "Palatino Linotype", Georgia, serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --deva:"Tiro Devanagari Hindi", "Noto Serif Devanagari", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0B1321; --alt:#0E1829; --surface:#122036; --ink:#E4E9F1; --muted:#A3AEC0; --faint:#7C889C; --line:#223250;
    --navy:#0C1B33; --navy-2:#081324; --gold:#CDAA6E; --gold-2:#D9BC86; --gold-soft:#231F17; --title:#F1F4F9;
    --shadow:0 12px 32px -18px rgba(0,0,0,.8);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0B1321; --alt:#0E1829; --surface:#122036; --ink:#E4E9F1; --muted:#A3AEC0; --faint:#7C889C; --line:#223250;
  --navy:#0C1B33; --navy-2:#081324; --gold:#CDAA6E; --gold-2:#D9BC86; --gold-soft:#231F17; --title:#F1F4F9;
  --shadow:0 12px 32px -18px rgba(0,0,0,.8);}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.7}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;color:var(--title);line-height:1.15}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 14px var(--sans);letter-spacing:.04em;padding:14px 26px;border-radius:2px;border:1px solid transparent;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#8F6D3C}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:#1A3560}
.btn-line{border-color:rgba(255,255,255,.4);color:#fff}
.btn-line:hover{border-color:var(--gold-2);color:var(--gold-2)}
.btn-outline{border-color:var(--line);color:var(--title);background:var(--surface)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}

/* utility bar + header */
.util{background:var(--navy-2);color:var(--navy-muted);font-size:13px}
.util .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px;flex-wrap:wrap}
.util span{display:inline-flex;align-items:center;gap:8px}
.util svg{width:14px;height:14px;stroke:var(--gold-2);fill:none;stroke-width:1.6}
.util .r{display:flex;gap:22px}
@media (max-width:760px){.util .l{display:none}.util .wrap{justify-content:center}.util .r{gap:14px}.util .em{display:none}}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 20px -16px rgba(14,34,64,.35)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:80px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.mark{width:48px;height:48px;flex:none;background:var(--navy);display:grid;place-items:center;border:1px solid var(--gold)}
.mark span{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--gold-2);letter-spacing:.04em}
.brand b{display:block;font-family:var(--serif);font-weight:700;font-size:23px;color:var(--title);line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-top:3px;white-space:nowrap}
.links{display:flex;align-items:center;gap:30px}
.links>a,.dd>button{font:600 14.5px var(--sans);color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer;padding:28px 0;position:relative}
.links>a:not(.btn)::after,.dd>button::after{content:"";position:absolute;left:0;right:0;bottom:20px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
.links>a:not(.btn):hover::after,.dd:hover>button::after,.links>a.on::after{transform:scaleX(1)}
.links>a.btn-gold{padding:12px 22px;background:var(--gold);color:#fff}
.links>a.btn-gold:hover{background:#8F6D3C}
section[id]{scroll-margin-top:90px}
.dd{position:relative}
.dd-menu{position:absolute;top:100%;left:-24px;background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--gold);min-width:300px;padding:10px 0;display:none;box-shadow:var(--shadow)}
.dd:hover .dd-menu,.dd.open .dd-menu{display:block}
.dd-menu a{display:flex;justify-content:space-between;padding:10px 24px;font-size:15px;text-decoration:none;color:var(--ink)}
.dd-menu a:hover{background:var(--alt);color:var(--gold)}
.menu-btn{display:none;background:none;border:1px solid var(--line);cursor:pointer;padding:9px;color:var(--title)}
.menu-btn svg{width:22px;height:22px}
@media (max-width:980px){
  .links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 24px 22px;max-height:80vh;overflow:auto;box-shadow:var(--shadow)}
  .links.open{display:flex}
  .links>a,.dd>button{padding:14px 0;text-align:left;border-bottom:1px solid var(--line);width:100%}
  .links>a::after,.dd>button::after{display:none}
  .dd-menu,.dd:hover .dd-menu{position:static;display:block;border:0;box-shadow:none;padding:4px 0 8px 10px;min-width:0}
  .dd-menu a{padding:8px 0}
  .links .btn{margin-top:18px}
  .menu-btn{display:inline-flex}
}
@media (max-width:480px){.brand b{font-size:18px;white-space:normal}.brand small{display:none}.mark{width:40px;height:40px}.mark span{font-size:16px}.nav{gap:12px}}

/* hero */
.hero{background:radial-gradient(ellipse at 75% 30%,#1B3968 0%,var(--navy) 45%,var(--navy-2) 100%);color:var(--navy-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:96px 150px}
.hero h1{color:#fff;font-size:clamp(40px,5.2vw,66px);font-weight:600;margin:22px 0 22px;letter-spacing:-.005em}
.hero h1 em{font-style:italic;color:var(--gold-2);font-weight:500}
.hero .lead{color:var(--navy-muted);font-size:18.5px;max-width:52ch;margin:0 0 34px}
.hero .deva{font-family:var(--deva);color:var(--gold-2);font-size:18px;margin-top:-8px;margin-bottom:22px;opacity:.9}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.facade{width:100%;max-width:520px;justify-self:end}
.facade svg{width:100%;height:auto;display:block}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;padding-block:64px 130px}.facade{max-width:380px;justify-self:center;order:-1;opacity:.85}}
.trust{position:relative;z-index:2;margin-top:-72px}
.trust-in{background:var(--surface);box-shadow:var(--shadow);border-top:3px solid var(--gold);display:grid;grid-template-columns:repeat(4,1fr)}
.trust-in>div{padding:28px 26px;display:flex;gap:16px;align-items:flex-start}
.trust-in>div+div{border-left:1px solid var(--line)}
.trust-in svg{width:30px;height:30px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.4}
.trust-in b{display:block;font-family:var(--serif);font-size:20px;color:var(--title);line-height:1.2}
.trust-in span{font-size:14px;color:var(--muted)}
@media (max-width:900px){.trust-in{grid-template-columns:1fr 1fr}.trust-in>div:nth-child(3){border-left:0}.trust-in>div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:520px){.trust-in{grid-template-columns:1fr}.trust-in>div+div{border-left:0;border-top:1px solid var(--line)}}

/* sections */
section.s{padding-block:100px}
section.alt{background:var(--alt)}
.sh{text-align:center;max-width:760px;margin:0 auto 56px}
.sh h2{font-size:clamp(34px,4vw,50px);margin-top:14px}
.sh p{color:var(--muted);font-size:17.5px;margin:0}
.rule{width:60px;height:2px;background:var(--gold);margin:20px auto}
.sh .eyebrow::before{display:none}

.about{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:start}
.about h2{font-size:clamp(34px,4vw,48px);margin:14px 0 20px}
.about p{color:var(--muted);font-size:17px;margin:0 0 16px}
.pillars{display:grid;gap:18px}
.pillar{background:var(--surface);border:1px solid var(--line);padding:24px 26px;display:grid;grid-template-columns:44px 1fr;gap:18px;box-shadow:var(--shadow)}
.pillar .ic{width:44px;height:44px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center}
.pillar svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.5}
.pillar h3{font-size:22px;margin-bottom:4px}
.pillar p{margin:0;font-size:15.5px}
@media (max-width:900px){.about{grid-template-columns:1fr;gap:40px}}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.pa{background:var(--surface);border:1px solid var(--line);padding:36px 32px 30px;text-decoration:none;display:flex;flex-direction:column;gap:12px;position:relative;transition:transform .25s,box-shadow .25s,border-color .25s}
.pa::after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.pa:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:transparent}
.pa:hover::after{transform:scaleX(1)}
.pa .ic{width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;margin-bottom:8px;transition:background .25s}
.pa .ic svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.4;transition:stroke .25s}
.pa:hover .ic{background:var(--navy)}
.pa:hover .ic svg{stroke:var(--gold-2)}
.pa h3{font-size:25px}
.pa p{margin:0;color:var(--muted);font-size:15.5px;flex:1}
.pa .more{font:700 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-top:10px}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.cards{grid-template-columns:1fr}}

.navy{background:var(--navy);color:var(--navy-ink)}
.navy .sh h2{color:#fff}
.navy .sh p{color:var(--navy-muted)}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--navy-line)}
.why div{padding:36px 30px}
.why div+div{border-left:1px solid var(--navy-line)}
.why .n{font-family:var(--serif);font-size:46px;color:var(--gold-2);line-height:1;font-weight:500}
.why h3{color:#fff;font-size:24px;margin:16px 0 10px}
.why p{color:var(--navy-muted);margin:0;font-size:15.5px}
@media (max-width:980px){.why{grid-template-columns:1fr 1fr}.why div:nth-child(3){border-left:0}.why div:nth-child(n+3){border-top:1px solid var(--navy-line)}}
@media (max-width:560px){.why{grid-template-columns:1fr}.why div+div{border-left:0;border-top:1px solid var(--navy-line)}}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:980px;margin:0 auto}
.chips span{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);padding:18px 22px;font-weight:600;color:var(--title)}
.chips span::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex:none}
@media (max-width:760px){.chips{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.chips{grid-template-columns:1fr}}

.founder{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px;align-items:center}
.portrait{position:relative;max-width:420px;padding:16px;background:var(--surface);border:2px solid var(--gold);box-shadow:var(--shadow)}
.portrait::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold-2);pointer-events:none}
.portrait .ph{position:relative;aspect-ratio:4/5;max-width:100%;background:linear-gradient(160deg,#1B3968,var(--navy-2));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.portrait .ph span{font-family:var(--serif);font-size:96px;color:rgba(201,169,110,.55);font-weight:600}
.portrait .ph small{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--navy-muted)}
.founder h2{font-size:clamp(36px,4vw,50px);margin:14px 0 4px}
.founder .role{font-weight:600;color:var(--gold);margin-bottom:22px;letter-spacing:.04em}
.founder p{color:var(--muted);font-size:17px;max-width:60ch}
.creds{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:26px}
.creds div{padding:16px 0;border-bottom:1px solid var(--line)}
.creds dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.creds dd{margin:4px 0 0;font-weight:600;color:var(--title)}
.creds .pending{color:var(--gold)}
@media (max-width:900px){.founder{grid-template-columns:1fr;gap:56px}.portrait{max-width:340px}}
@media (max-width:480px){.creds{grid-template-columns:1fr}}

.process{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:p;position:relative}
.process::before{content:"";position:absolute;top:32px;left:12%;right:12%;height:1px;background:var(--line)}
.process div{text-align:center;padding:0 18px;position:relative}
.process .n{width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--gold);display:grid;place-items:center;margin:0 auto 20px;font-family:var(--serif);font-size:24px;color:var(--gold);font-weight:600}
.process h3{font-size:22px;margin-bottom:8px}
.process p{color:var(--muted);margin:0;font-size:15.5px}
@media (max-width:860px){.process{grid-template-columns:1fr 1fr;row-gap:40px}.process::before{display:none}}
@media (max-width:480px){.process{grid-template-columns:1fr}}

.cta{background:linear-gradient(100deg,var(--navy-2),#1A3560);color:#fff}
.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap;padding-block:56px}
.cta h2{color:#fff;font-size:clamp(28px,3.2vw,40px)}
.cta p{margin:6px 0 0;color:var(--navy-muted)}
.cta .acts{display:flex;gap:12px;flex-wrap:wrap}

/* chambers */
.cham{display:grid;grid-template-columns:.9fr 1.1fr;gap:0;box-shadow:var(--shadow);border:1px solid var(--line)}
.cham-info{background:var(--navy);color:var(--navy-ink);padding:44px 40px}
.cham-info h3{color:#fff;font-size:30px;margin-bottom:24px}
.cham-info dl{margin:0}
.cham-info dl>div{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--navy-line)}
.cham-info .ic{width:40px;height:40px;border:1px solid rgba(201,169,110,.5);display:grid;place-items:center}
.cham-info .ic svg{width:18px;height:18px;stroke:var(--gold-2);fill:none;stroke-width:1.5}
.cham-info dt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);font-weight:600}
.cham-info dd{overflow-wrap:anywhere;margin:4px 0 0;font-size:16.5px;color:#fff;line-height:1.55}
.cham-info .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.copy{margin-left:8px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid rgba(255,255,255,.25);color:var(--navy-muted);padding:2px 8px;cursor:pointer;vertical-align:middle}
.copy:hover{border-color:var(--gold-2);color:var(--gold-2)}
form.intake{background:var(--surface);padding:44px 40px;display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;align-content:start}
form.intake h3{grid-column:1/-1;font-size:30px}
form.intake .sub{grid-column:1/-1;margin:-10px 0 4px;color:var(--muted);font-size:15px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label{font-size:13.5px;font-weight:600;color:var(--title)}
.f input,.f select,.f textarea{font:16px var(--sans);color:var(--ink);background:var(--alt);border:1px solid var(--line);padding:12px 14px;border-radius:2px}
.f textarea{min-height:110px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold);background:var(--surface)}
.ck{grid-column:1/-1;display:flex;gap:10px;font-size:14px;color:var(--muted)}
.ck input{margin-top:5px;accent-color:#A9834C}
.ff{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ff small{color:var(--faint);font-size:13px;max-width:36ch}
.ok{grid-column:1/-1;border-left:3px solid var(--gold);padding:14px 18px;background:var(--gold-soft);color:var(--ink)}
@media (max-width:900px){.cham{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){form.intake{grid-template-columns:1fr;padding:28px 22px}.cham-info{padding:32px 22px}}

/* footer */
footer.site{background:var(--navy-2);color:var(--navy-muted);padding-top:72px;font-size:15px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1.1fr 1.3fr;gap:44px}
.fgrid h6{margin:0 0 20px;font:600 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#fff;padding-bottom:12px;border-bottom:1px solid var(--navy-line);position:relative}
.fgrid h6::after{content:"";position:absolute;left:0;bottom:-1px;width:36px;height:2px;background:var(--gold)}
.fgrid a{display:block;text-decoration:none;padding:4px 0}
.fgrid a:hover{color:var(--gold-2)}
.fgrid p{margin:0 0 12px}
.fbrand{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.fbrand b{font-family:var(--serif);font-size:22px;color:#fff;display:block;line-height:1.1}
.fbrand small{color:var(--gold-2);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--navy-line);margin-top:56px;padding-block:22px;font-size:13.5px}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.fgrid{grid-template-columns:1fr}}

.wa{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:45;width:56px;height:56px;border-radius:50%;background:#1F8F5F;display:grid;place-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);transition:transform .2s}
.wa:hover{transform:scale(1.06)}
.wa svg{width:26px;height:26px;fill:#fff}

/* practice page */
.phero{background:radial-gradient(ellipse at 80% 20%,#1B3968 0%,var(--navy) 50%,var(--navy-2) 100%);color:#fff;position:relative;overflow:hidden}
.phero .wrap{position:relative;z-index:1;padding-block:70px 76px}
.crumbs{font-size:14px;color:var(--navy-muted);display:flex;gap:10px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--gold-2)}
.crumbs span{color:var(--gold-2)}
.phero h1{color:#fff;font-size:clamp(38px,5vw,60px);margin:18px 0 14px}
.phero p{color:var(--navy-muted);font-size:18.5px;max-width:62ch;margin:0}
.phero .ghost{position:absolute;right:-30px;bottom:-60px;width:360px;height:360px;opacity:.07;stroke:#fff;fill:none;stroke-width:.6}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:56px;padding-block:80px}
.side{position:sticky;top:110px;align-self:start;display:grid;gap:24px}
.side-box{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.side-box h4{font-size:22px;padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.side-box nav a{display:flex;justify-content:space-between;align-items:center;padding:13px 24px;text-decoration:none;border-bottom:1px solid var(--line);font-weight:500;font-size:15.5px}
.side-box nav a:last-child{border-bottom:0}
.side-box nav a:hover{color:var(--gold);background:var(--alt)}
.side-box nav a.on{background:var(--navy);color:#fff;border-left:3px solid var(--gold)}
.side-cta{background:var(--navy);color:var(--navy-muted);padding:28px 26px;border-top:3px solid var(--gold)}
.side-cta h4{color:#fff;font-size:24px;margin-bottom:8px}
.side-cta p{margin:0 0 18px;font-size:15px}
.side-cta .ph{font-family:var(--serif);font-size:24px;color:var(--gold-2);font-weight:600;margin-bottom:16px;display:block}
.side-cta .btn{width:100%}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr);gap:40px;padding-block:56px}.side{position:static}}

.main>section{padding-block:0 64px}
.main>section:last-child{padding-bottom:0}
.main .wrap{max-width:none;padding-inline:0}
.main section.s{padding-block:0 64px}
.main .sh{text-align:left;margin:0 0 28px;max-width:none}
.main .sh h2{font-size:clamp(30px,3.2vw,40px)}
.main .rule{margin:16px 0}
.main .eyebrow::before{display:inline-block}
.prose p{color:var(--muted);font-size:17.5px;margin:0 0 16px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);background:var(--alt);border:1px solid var(--line);margin-top:28px}
.facts div{padding:20px 20px}
.facts div+div{border-left:1px solid var(--line)}
.facts span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.facts b{display:block;font-family:var(--serif);font-size:19px;color:var(--title);margin-top:4px;line-height:1.3}
@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(3){border-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.groups div{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--navy);padding:24px 26px}
.groups h4{font-size:22px;margin-bottom:12px}
.groups ul{list-style:none;margin:0;padding:0}
.groups li{padding:6px 0 6px 22px;position:relative;color:var(--muted);font-size:15.5px}
.groups li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border:1.5px solid var(--gold);transform:rotate(45deg)}
@media (max-width:640px){.groups{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:st}
.steps div{background:var(--alt);border:1px solid var(--line);padding:20px 22px;display:flex;gap:14px;align-items:center}
.steps span{width:38px;height:38px;flex:none;border-radius:50%;background:var(--navy);color:var(--gold-2);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:17px}
.steps h4{font-size:19px}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.steps{grid-template-columns:1fr}}

.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:20px 48px 20px 0;position:relative;font-weight:600;font-size:17.5px;color:var(--title)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:0;top:14px;width:32px;height:32px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--gold);transition:transform .25s,background .25s}
.faq details[open] summary::after{content:"–";background:var(--navy);color:var(--gold-2);border-color:var(--navy)}
.faq details p{margin:0 0 22px;color:var(--muted);max-width:70ch}
.home-faq{max-width:860px;margin:0 auto}

.tbl{overflow-x:auto;border:1px solid var(--line);box-shadow:var(--shadow)}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;font-size:15.5px;background:var(--surface)}
.tbl th{text-align:left;font:600 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:15px 18px;background:var(--navy);color:#fff}
.tbl td{padding:15px 18px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--alt)}
.tbl td:first-child{color:var(--title);font-weight:600}
.tbl.sec td:last-child{color:var(--gold);font-weight:600;white-space:nowrap}
.note{font-size:13.5px;color:var(--faint);margin-top:14px;font-style:italic}

.journey{position:relative}
.journey::before{content:"";position:absolute;left:23px;top:10px;bottom:10px;width:2px;background:var(--line)}
.jstep{position:relative;display:grid;grid-template-columns:48px 1fr;gap:22px;padding-bottom:30px}
.jnum{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:var(--surface);display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--gold);position:relative;z-index:1}
.jstep.end .jnum{background:var(--navy);color:var(--gold-2);border-color:var(--navy)}
.jstep h3{font-size:23px;margin:8px 0 4px}
.jstep p{margin:0;color:var(--muted)}
.fork{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fork button{font:600 13px var(--sans);padding:7px 18px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;border-radius:2px}
.fork button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.branch{margin-top:10px;border-left:3px solid var(--gold);padding:10px 16px;background:var(--gold-soft);font-size:15px;color:var(--ink)}
.branch b{color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;display:block}

.prev{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.prev article{background:var(--surface);border:1px solid var(--line);padding:28px}
.prev .n{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold-2);font-family:var(--serif);font-weight:700}
.prev h3{font-size:23px;margin:14px 0 6px}
.prev p{color:var(--muted);margin:0}
.prev details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.prev summary{cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);list-style:none}
.prev summary::-webkit-details-marker{display:none}
.prev summary::after{content:" +"}
.prev details[open] summary::after{content:" –"}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.kv h5{margin:0 0 6px;font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--title)}
.kv ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
@media (max-width:700px){.prev,.kv{grid-template-columns:1fr}}

.remedies,.remedies.two{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.rem{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--navy);padding:26px;display:flex;flex-direction:column}
.rem h3{font-size:24px;margin-bottom:4px}
.rem .law{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--gold);margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{font:600 12.5px var(--sans);padding:6px 12px;background:var(--alt);border:1px solid var(--line);color:var(--muted);cursor:pointer;border-radius:2px}
.tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rem .panel{color:var(--muted);font-size:15.5px;min-height:96px}
.rem .panel ul,.rem .panel ol{margin:0;padding-left:20px}
.rem .panel li{margin-bottom:4px}
.rem .panel p{margin:0}
.rem .fit{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}
.rem .fit b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--title);margin-bottom:4px}
@media (max-width:700px){.remedies,.remedies.two{grid-template-columns:1fr}}

.match{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center}
.match ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.match li button{width:100%;text-align:left;font:600 15.5px var(--sans);padding:13px 16px;background:var(--surface);border:1px solid var(--line);color:var(--title);cursor:pointer;border-radius:2px}
.match li button.on{border-color:var(--gold);background:var(--gold-soft)}
.match #wa button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.match .col h5{font:700 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0 0 12px;color:var(--gold)}
.match svg{width:100%;height:320px;color:var(--gold)}
.match-cap{color:var(--muted);margin-top:22px;font-family:var(--serif);font-style:italic;font-size:21px}
@media (max-width:560px){.match{grid-template-columns:1fr 44px 1fr}.match li button{font-size:13.5px;padding:10px}}

/* gate */
.gate{position:fixed;inset:0;z-index:100;background:rgba(8,19,36,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate-in{background:var(--surface);max-width:640px;width:100%;border-top:4px solid var(--gold);box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:rise .35s ease-out}
.gate-head{background:var(--navy);padding:26px 34px;display:flex;align-items:center;gap:14px}
.gate-head b{font-family:var(--serif);font-size:24px;color:#fff;display:block;line-height:1.1}
.gate-head small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-2)}
.gate-body{padding:28px 34px 32px}
.gate-body h2{font-size:28px;margin-bottom:12px}
.gate-body p{color:var(--muted);font-size:15.5px;margin:0 0 12px}
.gate-body .ck{margin:18px 0 22px}
.gate-body .btn[disabled]{opacity:.45;cursor:not-allowed}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.fade{animation:fade .45s ease-out}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}

 faq:[['What is dakhil-kharij?','It is the mutation of land records: the name of the previous holder is removed (kharij) and the new holder is entered (dakhil) in the jamabandi.'],['My mutation was rejected. What now?','An appeal lies against the Circle Officer’s order. The time limit is short, so bring the order and your documents as soon as possible.'],['Does mutation decide ownership?','No. Mutation is a fiscal record for revenue purposes. Title is decided by the civil court on the basis of the documents. But an up-to-date record is important in practice.'],['Can errors in an old jamabandi be corrected?','Yes, through the correction process on the portal or by application before the revenue authorities, supported by documents.'],['Do you appear before the revenue courts in person?','Yes. Appearances before the Circle Officer, DCLR and Collector are part of the practice.']]},

 facts:[['न्यायालय','व्यवहार न्यायालय एवं पटना उच्च न्यायालय'],['विधि','सिविल प्रक्रिया संहिता 1908 · विनिर्दिष्ट अनुतोष अधिनियम 1963'],['चरण','वाद से निष्पादन तक'],['किसकी ओर से','वादी एवं प्रतिवादी']],
 groups:[['वाद',['बँटवारा वाद','संविदा का विनिर्दिष्ट पालन','स्वत्व की घोषणा','स्थायी एवं आज्ञापक व्यादेश','विलेख का निरस्तीकरण','कब्ज़े की वापसी']],['अंतरिम अनुतोष',['अस्थायी व्यादेश','यथास्थिति आदेश','रिसीवर की नियुक्ति','स्थानीय एवं सर्वेक्षण कमीशन']],['किरायेदारी',['किरायेदार की बेदख़ली','बकाया किराया','बिहार किराया नियंत्रण विधि के अंतर्गत कार्यवाही']],['अपील',['प्रथम अपील','उच्च न्यायालय में द्वितीय अपील','दीवानी पुनरीक्षण','विविध अपील']],['रिट याचिकाएँ',['अनुच्छेद 226 के अंतर्गत याचिका','प्रशासनिक आदेशों को चुनौती','सेवा मामले','राजस्व एवं भूमि संबंधी आदेश']],['निष्पादन',['डिक्री का निष्पादन','बँटवारे में अंतिम डिक्री','कब्ज़ा दिलाना','कुर्की एवं नीलामी']]],
 steps:['परामर्श','दस्तावेज़ एवं स्वत्व','अभिवचन','अंतरिम अनुतोष','साक्ष्य एवं विचारण','डिक्री एवं निष्पादन'],
 faq:[['दीवानी वाद में कितना समय लगता है?','यह न्यायालय, पक्षकारों की संख्या और साक्ष्य पर विवाद की सीमा पर निर्भर करता है। फ़ाइल देखने के बाद हम ईमानदार अनुमान देते हैं और मामले की प्रगति के साथ उसे अद्यतन करते हैं।'],['क्या शीघ्र व्यादेश मिल सकता है?','तात्कालिकता, प्रथमदृष्टया मामला और अपूरणीय क्षति की आशंका होने पर वाद के आरंभ में ही अस्थायी व्यादेश माँगा जा सकता है। एकपक्षीय अनुतोष केवल सीमित परिस्थितियों में दिया जाता है।'],['बँटवारा वाद में अंतिम डिक्री क्या है?','प्रारंभिक डिक्री हिस्सों की घोषणा करती है। अंतिम डिक्री, सामान्यतः कमिश्नर के प्रतिवेदन पर, संपत्ति का माप-जोख के अनुसार वास्तविक विभाजन करती है।'],['क्या आप किसी अन्य अधिवक्ता द्वारा संचालित मामले की अपील लेते हैं?','हाँ। अपील दायर करने से पहले हम विचारण अभिलेख देखकर अपील के आधारों पर सलाह देते हैं।'],['क्या परिसीमा (लिमिटेशन) महत्वपूर्ण है?','अत्यंत महत्वपूर्ण। परिसीमा अधिनियम, 1963 के अंतर्गत प्रत्येक वाद और अपील की समय-सीमा होती है। कृपया अपने काग़ज़ात समय रहते लाएँ ताकि इसकी जाँच हो सके।']]},

property:{title:'संपत्ति एवं स्वत्व',short:'स्वत्व खोज रिपोर्ट, विलेखों का प्रारूपण एवं जाँच, तथा भूमि और भवन संबंधी विवाद।',
 hero:'संपत्ति के पूरे जीवन-चक्र में परामर्श: ख़रीद से पहले की जाँच, हस्ताक्षरित दस्तावेज़, और उसके बाद उत्पन्न विवाद।',
 overview:['हम बिहार में भूमि और भवनों के संबंध में व्यक्तियों, परिवारों और संस्थाओं को परामर्श देते हैं। अधिकांश कार्य स्वत्व सत्यापन का है: पैसे के लेन-देन से पहले खतियान, निबंधित विलेखों, जमाबंदी प्रविष्टियों और लगान रसीदों के माध्यम से स्वामित्व की कड़ी की जाँच।','संपत्ति के प्रत्येक चरण को अलग कार्य के रूप में देखा जाता है: ख़रीद से पहले की जाँच, स्वयं लेन-देन, उसके बाद का अनुपालन, और विवाद होने पर मुक़दमा।'],
 groups:[['ख़रीदने से पहले',['स्वत्व खोज रिपोर्ट','स्वामित्व की कड़ी का सत्यापन','खतियान एवं जमाबंदी की जाँच','लगान रसीद एवं LPC की जाँच','मुक़दमों की खोज','जोखिम रिपोर्ट']],['लेन-देन के दस्तावेज़',['बिक्री इकरारनामा','विक्रय विलेख','दान विलेख','बँटवारा एवं पारिवारिक समझौता विलेख','मुख़्तारनामा','पट्टा एवं अनुज्ञप्ति']],['ख़रीद के बाद',['दाखिल-खारिज','भू-अभिलेखों का सुधार','नगर निगम होल्डिंग अभिलेख','लगान भुगतान अभिलेख']],['विवाद',['संयुक्त संपत्ति का बँटवारा','कब्ज़े की वापसी','कपटपूर्ण विलेख का निरस्तीकरण','सीमा एवं अतिक्रमण विवाद','बेदख़ली के विरुद्ध व्यादेश']],['राजस्व न्यायालय',['अंचल अधिकारी के समक्ष कार्यवाही','भूमि सुधार उप समाहर्ता (DCLR) के समक्ष अपील','समाहर्ता के समक्ष कार्यवाही','भूमि विवाद निराकरण कार्यवाही']],['बिल्डर एवं ख़रीदार',['विकास इकरारनामा','बिल्डर–ख़रीदार विवाद','फ़्लैट आवंटन दस्तावेज़','अपार्टमेंट स्वामित्व अभिलेख']]],
 steps:['विवरण','स्वत्व खोज','दस्तावेज़ीकरण','निबंधन','दाखिल-खारिज','निरंतर परामर्श'],
 faq:[['क्या भूमि ख़रीदने से पहले स्वत्व खोज आवश्यक है?','अत्यंत आवश्यक। ख़रीद के बाद के अधिकांश विवाद, बिक्री से पहले स्वत्व की कड़ी, राजस्व अभिलेख और लंबित मुक़दमों की जाँच करके पहले ही पकड़े जा सकते थे।'],['बिहार में आप कौन-से अभिलेख जाँचते हैं?','सामान्यतः सर्वे खतियान, कड़ी के निबंधित विलेख, जमाबंदी (पंजी II) प्रविष्टि, हाल की लगान रसीदें, तथा जहाँ उपलब्ध हो, भू-धारण प्रमाण-पत्र (LPC) और नक़्शा।'],['क्या आप पारिवारिक संपत्ति विवाद देखते हैं?','हाँ, बँटवारा, पारिवारिक समझौते और वारिसों के बीच के विवाद सहित।'],['क्या आप मुक़दमे के साथ विलेख भी बनाते हैं?','हाँ। संभावित विवादों को ध्यान में रखकर बनाया गया विलेख बाद के मुक़दमे से सबसे अच्छा बचाव है।'],['क्या बिल्डर विवादों में सहायता मिल सकती है?','हाँ, कब्ज़े में देरी तथा आवंटन एवं विकास इकरारनामे की शर्तों से जुड़े विवादों सहित।']]},

mutation:{title:'दाखिल-खारिज एवं भू-अभिलेख',short:'दाखिल-खारिज, जमाबंदी सुधार, तथा DCLR एवं समाहर्ता के समक्ष अपील।',

 groups:[['दाखिल-खारिज',['बिक्री के बाद दाखिल-खारिज','उत्तराधिकार पर दाखिल-खारिज','बँटवारे के बाद दाखिल-खारिज','दान या समझौते के अंतर्गत दाखिल-खारिज']],['अभिलेख सुधार',['नाम, रकबा या खेसरा की त्रुटि का सुधार','परिमार्जन आवेदन','नई जमाबंदी का सृजन','ग़लत जमाबंदी का रद्दीकरण']],['प्रमाण-पत्र',['भू-धारण प्रमाण-पत्र (LPC)','लगान रसीद','अभिलेखों की सत्यापित प्रतियाँ']],['विवादित मामले',['दाखिल-खारिज पर आपत्ति','अंचल अधिकारी के समक्ष सुनवाई','DCLR के समक्ष अपील','समाहर्ता के समक्ष पुनरीक्षण']]],
 steps:['दस्तावेज़ जाँच','ऑनलाइन आवेदन','स्थल जाँच','सुनवाई','आदेश','आवश्यकता होने पर अपील'],
 faq:[['दाखिल-खारिज क्या है?','यह भू-अभिलेखों का नामांतरण है: जमाबंदी में पूर्व धारक का नाम हटाया (खारिज) जाता है और नए धारक का नाम दर्ज (दाखिल) किया जाता है।'],['मेरा दाखिल-खारिज अस्वीकृत हो गया। अब क्या करें?','अंचल अधिकारी के आदेश के विरुद्ध अपील होती है। समय-सीमा कम है, अतः आदेश और दस्तावेज़ लेकर यथाशीघ्र संपर्क करें।'],['क्या दाखिल-खारिज से स्वामित्व तय होता है?','नहीं। दाखिल-खारिज राजस्व प्रयोजन का अभिलेख है। स्वत्व का निर्णय दस्तावेज़ों के आधार पर व्यवहार न्यायालय करता है। फिर भी व्यवहार में अद्यतन अभिलेख महत्वपूर्ण है।'],['क्या पुरानी जमाबंदी की त्रुटियाँ सुधारी जा सकती हैं?','हाँ, पोर्टल पर सुधार प्रक्रिया द्वारा या राजस्व प्राधिकारियों के समक्ष दस्तावेज़ों सहित आवेदन देकर।'],['क्या आप राजस्व न्यायालयों में स्वयं उपस्थित होते हैं?','हाँ। अंचल अधिकारी, DCLR और समाहर्ता के समक्ष उपस्थिति इस कार्य का हिस्सा है।']]},

recovery:{title:'धन वसूली',short:'बकाया बिल, ऋण और चेक की राशि की दीवानी, वाणिज्यिक एवं आपराधिक उपायों से वसूली।',
 hero:'व्यवसायों और व्यक्तियों को उनका बकाया वापस दिलाना — सही समय पर सही उपाय चुनकर।',heroBtn:'वसूली के विकल्प देखें',
 faq:[['आपराधिक मामला करूँ या दीवानी वाद?','आपराधिक मामला केवल छल, धोखाधड़ी या चेक अनादरण की स्थिति में उपयुक्त है। केवल पैसे का न लौटाना दीवानी मामला है। ग़लत रास्ता चुनने से समय नष्ट होता है और मामला कमज़ोर हो सकता है।'],['वसूली वाद दायर करने की समय-सीमा क्या है?','सामान्यतः राशि देय होने की तिथि से तीन वर्ष, जो लिखित स्वीकृति या आंशिक भुगतान से बढ़ सकती है। आपके दस्तावेज़ों पर इसकी जाँच आवश्यक है।'],['मैं पंजीकृत MSME हूँ। क्या इससे लाभ है?','हाँ। MSMED अधिनियम पंजीकृत सूक्ष्म एवं लघु आपूर्तिकर्ताओं को विलंबित भुगतान पर ब्याज और सुविधा परिषद में संदर्भ का अधिकार देता है।'],['क्या लीगल नोटिस आवश्यक है?','चेक अनादरण मामले में वैधानिक अवधि के भीतर नोटिस अनिवार्य है। अन्य मामलों में सुविचारित नोटिस से अक्सर मुक़दमे के बिना ही भुगतान मिल जाता है।']]},

family:{title:'पारिवारिक एवं वैवाहिक',short:'तलाक़, भरण-पोषण, बच्चों की अभिरक्षा तथा घरेलू हिंसा अधिनियम के अंतर्गत संरक्षण।',
 hero:'पारिवारिक मामले गोपनीयता के साथ, और क़ानूनी प्रश्न व निजी भावनाओं के बीच स्पष्ट भेद रखते हुए।',
 overview:['हम परिवार न्यायालय, मजिस्ट्रेट न्यायालयों और पटना उच्च न्यायालय में वैवाहिक, भरण-पोषण, अभिरक्षा और घरेलू हिंसा के मामलों में उपस्थित होते हैं। इन मामलों में पक्षकारों का संबंध मुक़दमे के बाद भी बना रहता है, और हम इसी ध्यान के साथ मामले संचालित करते हैं।','जहाँ समझौता या मध्यस्थता संभव हो, वहाँ विवादित सुनवाई से पहले उसे गंभीरता से आज़माया जाता है। जहाँ संभव न हो, वहाँ विचारण की पूरी तैयारी की जाती है।'],
 groups:[['आपसी सहमति से तलाक़',['याचिका का प्रारूपण','समझौते की शर्तें','प्रतीक्षा अवधि में छूट','न्यायालय में उपस्थिति']],['विवादित तलाक़',['आधार एवं अभिवचन','अंतरिम आवेदन','साक्ष्य एवं विचारण','अपील']],['भरण-पोषण',['BNSS के अंतर्गत भरण-पोषण','अंतरिम भरण-पोषण','स्थायी निर्वाह-व्यय','बकाया राशि की वसूली']],['अभिरक्षा एवं संरक्षकता',['अभिरक्षा एवं मुलाक़ात का अधिकार','अवयस्क की संरक्षकता','बच्चे का हित सर्वोपरि','अवयस्क की संपत्ति']],['घरेलू हिंसा',['संरक्षण आदेश','निवास आदेश','आर्थिक अनुतोष','घरेलू हिंसा आवेदन में बचाव']],['समझौता',['परिवार न्यायालय में मध्यस्थता','समझौता इकरारनामा','स्त्रीधन की वापसी','मामलों की वापसी एवं शमन']]],
 steps:['परामर्श','आकलन','रणनीति','दस्तावेज़ीकरण','मध्यस्थता या न्यायालय','समाधान'],
 faq:[['क्या मध्यस्थता अनिवार्य है?','परिवार न्यायालय सामान्यतः पक्षकारों को परामर्श या मध्यस्थता के लिए भेजते हैं। चैम्बर्स इसे औपचारिकता नहीं, समझौते का वास्तविक अवसर मानता है।'],['क्या ये मामले गोपनीय रखे जाते हैं?','हाँ। पारिवारिक मामले पूर्ण गोपनीयता से देखे जाते हैं, और जहाँ क़ानून अनुमति देता है, वहाँ सुनवाई बंद कमरे में हो सकती है।'],['क्या आप पति और पत्नी दोनों की ओर से मामला लेते हैं?','हाँ। मामले के अनुसार चैम्बर्स किसी भी पक्ष की ओर से कार्य करता है।'],['क्या आपसी तलाक़ में छह महीने की प्रतीक्षा अवधि माफ़ हो सकती है?','उपयुक्त मामलों में, जहाँ पक्षकार वास्तव में अलग हो चुके हों और सभी मुद्दे सुलझा चुके हों, न्यायालय इसे माफ़ कर सकता है।'],['अभिरक्षा के मामले में क्या देखा जाता है?','बच्चे का कल्याण सबसे प्रमुख विचार है, जो माता-पिता के दावों से ऊपर है।']]},

succession:{title:'उत्तराधिकार एवं वसीयत',short:'वसीयत, प्रोबेट, उत्तराधिकार प्रमाण-पत्र और विरासत संबंधी विवाद।',
 hero:'वसीयत, उत्तराधिकार प्रमाण-पत्र और पारिवारिक समझौते — ऐसे लिखे गए कि बिना विवाद लागू हो सकें।',
 overview:['उत्तराधिकार का कार्य यह दर्ज करना है कि व्यक्ति अपनी संपत्ति के बारे में क्या चाहता है, और फिर सुनिश्चित करना कि वैसा ही हो। हम स्पष्ट और चुनौती-रोधी वसीयत बनाते हैं, और बाद में न्यायालयों में वारिसों एवं निष्पादकों का प्रतिनिधित्व करते हैं।','जहाँ वसीयत नहीं है, वहाँ हम लागू व्यक्तिगत विधि के अनुसार वारिसों को उनके हिस्से पर सलाह देते हैं और बैंकों, कंपनियों एवं निबंधकों द्वारा माँगे जाने वाले प्रमाण-पत्र प्राप्त कराते हैं।'],
 groups:[['वसीयत',['वसीयत का प्रारूपण','कोडिसिल एवं संशोधन','निष्पादन एवं साक्षी','वैकल्पिक निबंधन']],['प्रोबेट एवं प्रशासन',['प्रोबेट याचिका','प्रशासन-पत्र','विवादित प्रोबेट','निष्पादक को सहायता']],['उत्तराधिकार प्रमाण-पत्र',['बैंक खाते एवं जमा राशि','शेयर एवं प्रतिभूतियाँ','मृतक को देय ऋण']],['वारिस एवं विरासत',['वारिसान संबंधी दस्तावेज़','व्यक्तिगत विधि के अनुसार हिस्से','पारिवारिक समझौते','विरासत विवाद']]],
 steps:['विवरण','संपत्ति सूची','संरचना','प्रारूपण','निष्पादन','समीक्षा'],
 faq:[['छोटी संपत्ति होने पर भी क्या वसीयत आवश्यक है?','हाँ। संपत्ति कितनी भी हो, वसीयत वारिसों के बीच विवाद से बचाती है और संपत्ति के हस्तांतरण को बहुत सरल बनाती है।'],['क्या वसीयत का निबंधन अनिवार्य है?','निबंधन वैकल्पिक है, परंतु इससे वसीयत की प्रामाणिकता सिद्ध करने में सहायता मिलती है और उसे चुनौती देना कठिन हो जाता है।'],['क्या प्रोबेट हमेशा आवश्यक है?','हमेशा नहीं। यह वसीयतकर्ता के धर्म और संपत्ति के स्थान पर निर्भर करता है। हम प्रत्येक मामले में इस पर सलाह देते हैं।'],['उत्तराधिकार प्रमाण-पत्र किस काम आता है?','इससे वारिस मृतक के ऋण और प्रतिभूतियाँ, जैसे बैंक शेष और शेयर, प्राप्त कर सकते हैं।'],['क्या मौजूदा वसीयत बदली जा सकती है?','हाँ, वसीयतकर्ता के जीवनकाल में कोडिसिल या नई वसीयत द्वारा।']]},

documents:{title:'नोटिस एवं दस्तावेज़ीकरण',short:'लीगल नोटिस, उनके उत्तर, इकरारनामे और विलेख — संभावित विवाद को ध्यान में रखकर तैयार।',
 hero:'ऐसे दस्तावेज़ जो तय बातों को इतनी स्पष्टता से दर्ज करें कि विवाद होने पर भी टिक सकें।',
 overview:['बहुत-से विवाद काग़ज़ात के सही लेखन से टाले जा सकते हैं, या जीते जा सकते हैं। हम पटना में व्यक्तियों और व्यवसायों के लिए नोटिस, इकरारनामे और विलेख तैयार करते और जाँचते हैं।','जिन व्यवसायों को अनुबंधों और नोटिसों की नियमित समीक्षा चाहिए, वे निरंतर परामर्श के लिए चैम्बर्स को रिटेनर पर रख सकते हैं।'],
 groups:[['लीगल नोटिस',['माँग नोटिस','चेक अनादरण नोटिस','CPC के अंतर्गत सरकार को नोटिस','नोटिस का उत्तर']],['इकरारनामे',['बिक्री इकरारनामा','आपूर्ति एवं वितरण अनुबंध','सेवा अनुबंध','साझेदारी विलेख','समझौता ज्ञापन (MoU)']],['विलेख',['विक्रय, दान एवं बँटवारा विलेख','पारिवारिक समझौता विलेख','मुख़्तारनामा','पट्टा एवं अनुज्ञप्ति']],['व्यावसायिक दस्तावेज़',['व्यापार की शर्तें','ब्याज धारा सहित बिल','वसूली हेतु उपयुक्त दस्तावेज़','रिटेनर परामर्श']]],
 steps:['विवरण','जोखिम समीक्षा','प्रारूपण','वार्ता','निष्पादन','अनुवर्ती कार्य'],
 faq:[['लीगल नोटिस कितनी जल्दी भेजा जा सकता है?','सामान्यतः दस्तावेज़ और निर्देश मिलने के कुछ दिनों के भीतर।'],['क्या लीगल नोटिस का उत्तर देना आवश्यक है?','क़ानूनन हमेशा अनिवार्य नहीं, परंतु अनुत्तरित नोटिस बाद में आपके विरुद्ध प्रयोग हो सकता है। हम प्रत्येक मामले में सलाह देते हैं।'],['क्या आप दूसरे पक्ष द्वारा बनाए इकरारनामे की जाँच करते हैं?','हाँ। हस्ताक्षर से पहले हम मसौदे पर टिप्पणी करते हैं और जोखिम समझाते हैं।'],['क्या व्यवसाय चैम्बर्स को रिटेनर पर रख सकते हैं?','हाँ, नोटिस, अनुबंध और वसूली मामलों की निरंतर समीक्षा के लिए।']]}
};

ipo:{icon:'chart',title:'MSME & SME IPO',short:'Legal due diligence, restructuring and documentation for MSMEs listing on the SME platforms of BSE and NSE.',
 hero:'Legal preparation for growing enterprises raising capital through an SME IPO on BSE SME or NSE Emerge.',
 overview:['An SME IPO lets a small or medium enterprise raise equity from the public and list on a dedicated SME platform. Before that can happen, the company’s legal house must be in order: its constitution, title to its assets, licences, contracts, litigation and past filings are all examined and disclosed in the offer document.','We act as legal advisors on the Indian law side, working alongside the SEBI-registered merchant banker, statutory auditor and company secretary. Our role is to find and fix legal gaps early, so that they do not delay the issue or appear as risk factors in the prospectus.'],
 facts:[['Platforms','BSE SME · NSE Emerge'],['Regulation','SEBI ICDR Regulations, 2018 (Ch. IX)'],['Company law','Companies Act, 2013'],['Works with','Merchant banker, CA, CS']],
 groups:[['IPO Readiness',['Legal health check of the company','Eligibility review against SEBI and exchange norms','Gap analysis and remediation plan','Timeline planning with the merchant banker']],['Corporate Restructuring',['Conversion from private to public company','Alteration of MoA and AoA','Share capital restructuring','Promoter and group entity clean-up']],['Legal Due Diligence',['Title to land and buildings','Licences and statutory approvals','Material contracts','Litigation involving the company, promoters and directors']],['Offer Documentation',['Legal inputs for DRHP and prospectus','Outstanding litigation disclosures','Government approvals section','Legal opinions and certificates']],['Governance',['Board and committee constitution','Independent directors','Related-party transaction policies','Insider trading and listing compliance policies']],['Post-Listing',['Continuing listing compliance','Utilisation of issue proceeds','Migration to main board','Shareholder and regulatory matters']]],
 timeline:{eye:'The listing journey',h:'From Private Company to Listed Enterprise',sub:'The usual sequence for an SME IPO. Timelines depend on the company’s state of readiness.',steps:[['Readiness assessment','Review of financials, eligibility, corporate records and pending litigation.'],['Conversion & restructuring','The company is converted into a public limited company and its constitution and capital are aligned for listing.'],['Appointment of intermediaries','Merchant banker, registrar, auditor and legal advisor are appointed.'],['Legal due diligence','Title, licences, contracts, litigation and past filings are verified and gaps are cured.'],['Draft offer document','The DRHP is prepared with legal disclosures and filed with the stock exchange.'],['Exchange approval & filing','Observations are answered, in-principle approval is obtained and the prospectus is filed with the Registrar of Companies.'],['Issue & listing','The issue opens, shares are allotted and trading begins on the SME platform.']],note:'Eligibility conditions such as track record, profitability and net worth are prescribed by SEBI and the exchanges and are revised from time to time. They are checked afresh for every issue.'},
 steps:['Health Check','Restructuring','Due Diligence','Documentation','Approval','Listing'],
 faq:[['What is an SME IPO?','A public issue by a small or medium enterprise that lists on the SME platform of a stock exchange, such as BSE SME or NSE Emerge, under the SME chapter of the SEBI ICDR Regulations.'],['Can a private limited company go for an IPO?','It must first convert into a public limited company. The conversion, and the changes to its articles and capital, are part of the pre-IPO legal work.'],['Is a merchant banker required?','Yes. An SME IPO must be managed by a SEBI-registered merchant banker. The chambers works with the banker as legal advisor on the issue.'],['Why is legal due diligence so important?','Every material legal fact must be disclosed in the offer document. Defects in title, missing licences or undisclosed litigation can delay approval or expose the company and its directors to liability.'],['Are eligibility rules fixed?','No. SEBI and the exchanges revise eligibility conditions from time to time, so they are checked against the current rules at the start of each engagement.']]},

divorce:{icon:'rings',title:'Divorce',short:'Mutual consent and contested divorce, alimony, custody and settlement, under every personal law.',
 hero:'Divorce proceedings conducted with discretion, clear advice on the options, and a settlement-first approach where it is possible.',
 overview:['Divorce is often the most difficult legal step a person takes. We advise on whether a marriage can be dissolved by mutual consent or must be contested, what each route involves, and what can be agreed on alimony, custody, stridhan and property along the way.','We appear before the Family Court at Patna and other districts of Bihar, and in appeals before the Patna High Court. Petitions are filed under the law that applies to the marriage: the Hindu Marriage Act, the Special Marriage Act, Muslim personal law or the Divorce Act for Christian marriages.'],
 facts:[['Forum','Family Court · Patna High Court'],['Laws','HMA 1955 · SMA 1954 · Divorce Act 1869'],['Routes','Mutual consent · Contested'],['Related','Alimony · Custody · DV']],
 groups:[['Mutual Consent Divorce',['Joint petition drafting','Settlement agreement','First and second motion','Waiver of the waiting period']],['Contested Divorce',['Cruelty, desertion and other grounds','Written statement and counter-claims','Evidence and cross-examination','Judgment and decree']],['Alimony & Maintenance',['Interim maintenance during the case','Permanent alimony','One-time settlement','Enforcement of orders']],['Children',['Custody and visitation','Child support','Guardianship','Relocation disputes']],['Connected Matters',['Return of stridhan','Domestic violence proceedings','Withdrawal of cases on settlement','Restitution of conjugal rights']],['Appeals',['Appeal against divorce decree','Appeal on maintenance orders','Transfer petitions']]],
 table:{eye:'At a glance',h:'Mutual Consent or Contested?',sub:'The two routes under the Hindu Marriage Act, 1955, compared.',th:['','Mutual consent','Contested'],rows:[['Provision','Section 13B','Section 13'],['Who files','Husband and wife jointly','Either spouse'],['Pre-condition','Living separately for at least one year','A ground such as cruelty, desertion or adultery'],['Waiting period','Six months after the first motion; may be waived in suitable cases','No statutory waiting period; depends on trial'],['Evidence','Statements of both parties','Full trial with witnesses'],['Usual duration','Months','Often years']],note:'Other personal laws have their own provisions and conditions. Waiver of the six-month period: Amardeep Singh v. Harveen Kaur, (2017) 8 SCC 746.'},
 steps:['Consultation','Choosing the Route','Petition','Mediation','Hearing & Evidence','Decree'],
 faq:[['How long does a mutual consent divorce take?','Usually a few months. After the first motion there is a six-month waiting period, which the court may waive where the parties have been separated for long and have settled everything.'],['What are the grounds for a contested divorce?','Under the Hindu Marriage Act they include cruelty, desertion for two years, adultery, conversion, and certain forms of mental disorder, among others. The ground must be pleaded and proved with evidence.'],['Can alimony be settled in one payment?','Yes. In mutual consent divorces a one-time settlement covering alimony and stridhan is common, and is recorded in the decree.'],['What happens to the children?','Custody and visitation are decided on the welfare of the child. In mutual consent cases, the parents agree on arrangements, which the court records.'],['I married under the Special Marriage Act. Does the same law apply?','No. Divorce under the Special Marriage Act has its own provisions, including mutual consent under Section 28. We advise on the law that applies to your marriage.']]},

immigration:{icon:'globe',title:'Immigration & Passport',short:'Passport refusals, permission to travel abroad in pending cases, Look Out Circulars and documents for visas.',
 hero:'The Indian legal side of travel, study and work abroad: passports, court permissions, Look Out Circulars and the documents embassies ask for.',
 overview:['Many people in Bihar find that a pending case, a family dispute or a paperwork error stands between them and a passport, a visa or a job abroad. We handle the Indian legal side of these problems: passport refusals and impoundings, court permission to travel while a case is pending, challenges to Look Out Circulars, and the affidavits, certificates and corrections that visa applications need.','Advice on the immigration law of a foreign country is given by practitioners licensed in that country. Where needed, we coordinate with them while handling the Indian proceedings and documents ourselves.'],
 facts:[['Laws','Passports Act, 1967 · Emigration Act, 1983'],['Forums','Trial courts · Patna High Court'],['Authorities','Regional Passport Office, Patna'],['Covers','Passport · Travel · Documents']],

ipo:{title:'MSME एवं SME IPO',short:'BSE एवं NSE के SME प्लेटफ़ॉर्म पर सूचीबद्ध होने वाले MSME के लिए विधिक जाँच, पुनर्गठन और दस्तावेज़ीकरण।',
 hero:'BSE SME या NSE Emerge पर SME IPO के माध्यम से पूँजी जुटाने वाले उद्यमों की विधिक तैयारी।',
 overview:['SME IPO के माध्यम से लघु एवं मध्यम उद्यम जनता से पूँजी जुटाकर विशेष SME प्लेटफ़ॉर्म पर सूचीबद्ध हो सकते हैं। इससे पहले कंपनी के विधिक मामलों का व्यवस्थित होना आवश्यक है: उसका संविधान, परिसंपत्तियों पर स्वत्व, अनुज्ञप्तियाँ, अनुबंध, मुक़दमे और पूर्व की फ़ाइलिंग — सबकी जाँच कर प्रस्ताव दस्तावेज़ में प्रकटीकरण किया जाता है।','हम भारतीय विधि के पक्ष पर विधिक सलाहकार के रूप में, SEBI-पंजीकृत मर्चेंट बैंकर, सांविधिक लेखा परीक्षक और कंपनी सचिव के साथ कार्य करते हैं। हमारा उद्देश्य विधिक कमियों को समय रहते पहचानकर दूर करना है, ताकि वे निर्गम में देरी न करें या प्रॉस्पेक्टस में जोखिम कारक के रूप में न आएँ।'],
 facts:[['प्लेटफ़ॉर्म','BSE SME · NSE Emerge'],['विनियम','SEBI ICDR विनियम, 2018 (अध्याय IX)'],['कंपनी विधि','कंपनी अधिनियम, 2013'],['सहयोग','मर्चेंट बैंकर, CA, CS']],
 groups:[['IPO की तैयारी',['कंपनी की विधिक स्वास्थ्य जाँच','SEBI एवं एक्सचेंज मानदंडों पर पात्रता समीक्षा','कमियों का विश्लेषण एवं सुधार योजना','मर्चेंट बैंकर के साथ समय-सारणी']],['कॉर्पोरेट पुनर्गठन',['प्राइवेट से पब्लिक कंपनी में रूपांतरण','MoA एवं AoA में परिवर्तन','शेयर पूँजी का पुनर्गठन','प्रवर्तक एवं समूह इकाइयों की व्यवस्था']],['विधिक जाँच (ड्यू डिलिजेंस)',['भूमि एवं भवन पर स्वत्व','अनुज्ञप्तियाँ एवं वैधानिक अनुमोदन','महत्वपूर्ण अनुबंध','कंपनी, प्रवर्तकों एवं निदेशकों से जुड़े मुक़दमे']],['प्रस्ताव दस्तावेज़',['DRHP एवं प्रॉस्पेक्टस हेतु विधिक सामग्री','लंबित मुक़दमों का प्रकटीकरण','सरकारी अनुमोदन खंड','विधिक राय एवं प्रमाण-पत्र']],['शासन व्यवस्था',['बोर्ड एवं समितियों का गठन','स्वतंत्र निदेशक','संबंधित पक्ष लेन-देन नीतियाँ','इनसाइडर ट्रेडिंग एवं लिस्टिंग अनुपालन नीतियाँ']],['लिस्टिंग के बाद',['निरंतर लिस्टिंग अनुपालन','निर्गम राशि का उपयोग','मुख्य बोर्ड पर स्थानांतरण','शेयरधारक एवं नियामक मामले']]],
 timeline:{eye:'लिस्टिंग की प्रक्रिया',h:'प्राइवेट कंपनी से सूचीबद्ध उद्यम तक',sub:'SME IPO का सामान्य क्रम। समय-सीमा कंपनी की तैयारी पर निर्भर करती है।',steps:[['तैयारी का आकलन','वित्तीय स्थिति, पात्रता, कॉर्पोरेट अभिलेख और लंबित मुक़दमों की समीक्षा।'],['रूपांतरण एवं पुनर्गठन','कंपनी को पब्लिक लिमिटेड में बदला जाता है और उसका संविधान एवं पूँजी लिस्टिंग के अनुरूप की जाती है।'],['मध्यस्थों की नियुक्ति','मर्चेंट बैंकर, रजिस्ट्रार, लेखा परीक्षक और विधिक सलाहकार की नियुक्ति।'],['विधिक जाँच','स्वत्व, अनुज्ञप्तियाँ, अनुबंध, मुक़दमे और पूर्व फ़ाइलिंग का सत्यापन एवं कमियों का सुधार।'],['प्रारूप प्रस्ताव दस्तावेज़','विधिक प्रकटीकरण सहित DRHP तैयार कर स्टॉक एक्सचेंज में दाखिल किया जाता है।'],['एक्सचेंज अनुमोदन एवं फ़ाइलिंग','टिप्पणियों का उत्तर, सैद्धांतिक अनुमोदन, और कंपनी रजिस्ट्रार के पास प्रॉस्पेक्टस दाखिल।'],['निर्गम एवं लिस्टिंग','निर्गम खुलता है, शेयर आवंटित होते हैं और SME प्लेटफ़ॉर्म पर व्यापार शुरू होता है।']],note:'ट्रैक रिकॉर्ड, लाभप्रदता और नेट वर्थ जैसी पात्रता शर्तें SEBI एवं एक्सचेंज निर्धारित करते हैं और समय-समय पर बदलती हैं। प्रत्येक निर्गम के लिए इनकी नए सिरे से जाँच होती है।'},
 steps:['स्वास्थ्य जाँच','पुनर्गठन','विधिक जाँच','दस्तावेज़ीकरण','अनुमोदन','लिस्टिंग'],
 faq:[['SME IPO क्या है?','लघु या मध्यम उद्यम द्वारा जारी सार्वजनिक निर्गम, जो SEBI ICDR विनियमों के SME अध्याय के अंतर्गत BSE SME या NSE Emerge जैसे SME प्लेटफ़ॉर्म पर सूचीबद्ध होता है।'],['क्या प्राइवेट लिमिटेड कंपनी IPO ला सकती है?','पहले उसे पब्लिक लिमिटेड कंपनी में बदलना होता है। यह रूपांतरण तथा आर्टिकल्स और पूँजी में परिवर्तन IPO-पूर्व विधिक कार्य का हिस्सा है।'],['क्या मर्चेंट बैंकर आवश्यक है?','हाँ। SME IPO का प्रबंधन SEBI-पंजीकृत मर्चेंट बैंकर द्वारा होना अनिवार्य है। चैम्बर्स निर्गम पर विधिक सलाहकार के रूप में बैंकर के साथ कार्य करता है।'],['विधिक जाँच इतनी महत्वपूर्ण क्यों है?','हर महत्वपूर्ण विधिक तथ्य का प्रस्ताव दस्तावेज़ में प्रकटीकरण आवश्यक है। स्वत्व में दोष, अनुज्ञप्ति का अभाव या अप्रकट मुक़दमे अनुमोदन में देरी कर सकते हैं या कंपनी एवं निदेशकों को दायित्व में डाल सकते हैं।'],['क्या पात्रता नियम स्थिर हैं?','नहीं। SEBI और एक्सचेंज समय-समय पर पात्रता शर्तें बदलते हैं, इसलिए प्रत्येक कार्य की शुरुआत में वर्तमान नियमों से जाँच की जाती है।']]},

divorce:{title:'तलाक़',short:'आपसी सहमति एवं विवादित तलाक़, निर्वाह-व्यय, अभिरक्षा और समझौता — सभी व्यक्तिगत विधियों के अंतर्गत।',
 hero:'तलाक़ की कार्यवाही गोपनीयता के साथ, विकल्पों पर स्पष्ट सलाह, और जहाँ संभव हो वहाँ समझौते को प्राथमिकता।',
 overview:['तलाक़ प्रायः व्यक्ति का सबसे कठिन विधिक निर्णय होता है। हम सलाह देते हैं कि विवाह आपसी सहमति से समाप्त हो सकता है या विवादित मामला दायर करना होगा, प्रत्येक रास्ते में क्या शामिल है, और निर्वाह-व्यय, अभिरक्षा, स्त्रीधन एवं संपत्ति पर क्या तय किया जा सकता है।','हम पटना एवं बिहार के अन्य ज़िलों के परिवार न्यायालयों में तथा पटना उच्च न्यायालय में अपीलों में उपस्थित होते हैं। याचिका विवाह पर लागू विधि के अंतर्गत दायर की जाती है: हिंदू विवाह अधिनियम, विशेष विवाह अधिनियम, मुस्लिम व्यक्तिगत विधि या ईसाई विवाहों हेतु तलाक़ अधिनियम।'],
 facts:[['न्यायालय','परिवार न्यायालय · पटना उच्च न्यायालय'],['विधि','HMA 1955 · SMA 1954 · तलाक़ अधिनियम 1869'],['रास्ते','आपसी सहमति · विवादित'],['संबंधित','निर्वाह-व्यय · अभिरक्षा · घरेलू हिंसा']],
 groups:[['आपसी सहमति से तलाक़',['संयुक्त याचिका का प्रारूपण','समझौता इकरारनामा','प्रथम एवं द्वितीय मोशन','प्रतीक्षा अवधि में छूट']],['विवादित तलाक़',['क्रूरता, परित्याग एवं अन्य आधार','लिखित कथन एवं प्रति-दावे','साक्ष्य एवं प्रति-परीक्षा','निर्णय एवं डिक्री']],['निर्वाह-व्यय एवं भरण-पोषण',['मामले के दौरान अंतरिम भरण-पोषण','स्थायी निर्वाह-व्यय','एकमुश्त समझौता','आदेशों का निष्पादन']],['बच्चे',['अभिरक्षा एवं मुलाक़ात','बच्चे का भरण-पोषण','संरक्षकता','स्थान परिवर्तन विवाद']],['संबंधित मामले',['स्त्रीधन की वापसी','घरेलू हिंसा की कार्यवाही','समझौते पर मामलों की वापसी','दांपत्य अधिकारों की पुनर्स्थापना']],['अपील',['तलाक़ डिक्री के विरुद्ध अपील','भरण-पोषण आदेश पर अपील','स्थानांतरण याचिका']]],
 table:{eye:'एक नज़र में',h:'आपसी सहमति या विवादित?',sub:'हिंदू विवाह अधिनियम, 1955 के अंतर्गत दोनों रास्तों की तुलना।',th:['','आपसी सहमति','विवादित'],rows:[['प्रावधान','धारा 13B','धारा 13'],['कौन दायर करता है','पति-पत्नी संयुक्त रूप से','कोई भी पति या पत्नी'],['पूर्व शर्त','कम से कम एक वर्ष से अलग रहना','क्रूरता, परित्याग या व्यभिचार जैसा कोई आधार'],['प्रतीक्षा अवधि','प्रथम मोशन के बाद छह माह; उपयुक्त मामलों में माफ़ हो सकती है','कोई वैधानिक प्रतीक्षा अवधि नहीं; विचारण पर निर्भर'],['साक्ष्य','दोनों पक्षों के बयान','गवाहों सहित पूर्ण विचारण'],['सामान्य अवधि','कुछ महीने','प्रायः कई वर्ष']],note:'अन्य व्यक्तिगत विधियों के अपने प्रावधान एवं शर्तें हैं। छह माह की अवधि में छूट: अमरदीप सिंह बनाम हरवीन कौर, (2017) 8 SCC 746।'},
 steps:['परामर्श','रास्ते का चयन','याचिका','मध्यस्थता','सुनवाई एवं साक्ष्य','डिक्री'],
 faq:[['आपसी सहमति से तलाक़ में कितना समय लगता है?','सामान्यतः कुछ महीने। प्रथम मोशन के बाद छह माह की प्रतीक्षा अवधि होती है, जिसे न्यायालय तब माफ़ कर सकता है जब पक्षकार लंबे समय से अलग हों और सब कुछ तय कर चुके हों।'],['विवादित तलाक़ के आधार क्या हैं?','हिंदू विवाह अधिनियम के अंतर्गत इनमें क्रूरता, दो वर्ष का परित्याग, व्यभिचार, धर्म परिवर्तन और कुछ प्रकार के मानसिक विकार आदि शामिल हैं। आधार का अभिवचन कर साक्ष्य से सिद्ध करना होता है।'],['क्या निर्वाह-व्यय एकमुश्त तय हो सकता है?','हाँ। आपसी सहमति के तलाक़ में निर्वाह-व्यय और स्त्रीधन का एकमुश्त समझौता सामान्य है, जिसे डिक्री में दर्ज किया जाता है।'],['बच्चों का क्या होता है?','अभिरक्षा और मुलाक़ात का निर्णय बच्चे के कल्याण के आधार पर होता है। आपसी सहमति के मामलों में माता-पिता व्यवस्था तय करते हैं, जिसे न्यायालय दर्ज करता है।'],['मेरा विवाह विशेष विवाह अधिनियम के अंतर्गत हुआ है। क्या वही विधि लागू होगी?','नहीं। विशेष विवाह अधिनियम में तलाक़ के अपने प्रावधान हैं, जिनमें धारा 28 के अंतर्गत आपसी सहमति शामिल है। हम आपके विवाह पर लागू विधि पर सलाह देते हैं।']]},

  if(!n||!/^[0-9+\s-]{10,15}$/.test(p)||!a){err.textContent=x.fmErr;err.style.color='var(--gold)';return}
  err.textContent=x.fmReq;err.style.color='';
  const lines=[`*${x.waHead}*`,'',`${x.waN}: ${n}`,`${x.waP}: ${p}`,`${x.waT}: ${v('#q-topic')}`];
  if(v('#q-court'))lines.push(`${x.waC}: ${v('#q-court')}`);
  if(v('#q-msg'))lines.push('',`${x.waM}: ${v('#q-msg')}`);
  const url=WA+'?text='+encodeURIComponent(lines.join('\n'));
  let w=null;try{w=window.open(url,'_blank','noopener')}catch(_){}
  let box=$('#q-done');if(!box){box=document.createElement('div');box.id='q-done';box.className='ok';f.appendChild(box)}
  box.innerHTML=`<p style="margin:0 0 12px">${x.fmOk}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-wa" style="width:auto;margin:0" href="${url}" target="_blank" rel="noopener">${icon('wa')}${x.fmOpen}</a><button type="button" class="btn btn-outline" id="q-edit">${x.fmEdit}</button></div>`;
  f.querySelectorAll('.f,.ck,.ff,.sub').forEach(el=>el.hidden=true);
  $('#q-edit').addEventListener('click',()=>{f.querySelectorAll('.f,.ck,.ff,.sub').forEach(el=>el.hidden=false);box.remove()});
 });
}

/* ---------- routing ---------- */
let current=null;
function route(keepScroll){
 const h=(location.hash||'#home').slice(1);
 const page=PAGES[h]?h:'home';
 if(page!==current){
  current=page;
  $('#app').innerHTML=(page==='home'?home():practice(page))+footer();
  if(keepScroll!==true)$('#app').firstElementChild.classList.add('fade');
  document.title=(page==='home'?'':P(page).title+' · ')+t().brand;
  wireCommon();
  if(page==='mutation')journeyWire();
  if(page==='recovery')recoveryWire();
  if(page==='succession')willWire();
  if(keepScroll!==true&&(PAGES[h]||h==='home'))scrollTo({top:0,behavior:'instant'});
 }
 if(keepScroll!==true&&!PAGES[h]&&h!=='home'){const el=document.getElementById(h);if(el)requestAnimationFrame(()=>el.scrollIntoView())}
 document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===(page==='home'?h:'')));
 const L=$('#links');if(L){L.classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#dd').classList.remove('open')}
}
document.addEventListener('click',e=>{const d=$('#dd');if(d&&!d.contains(e.target))d.classList.remove('open');
 const a=e.target.closest('a[href^="#"]');if(a&&a.hash===location.hash){e.preventDefault();route()}});
addEventListener('hashchange',()=>route());

document.documentElement.lang=LANG;
renderChrome();
(function(){let ok=false;try{ok=sessionStorage.getItem('clc-gate')==='1'}catch(e){}
 if(ok)$('#gate').hidden=true;else document.body.style.overflow='hidden'})();
route();

</script>
